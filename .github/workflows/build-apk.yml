name: Build Android APK

# Сборка идёт на серверах GitHub, а не на твоём компьютере:
# Android SDK, NDK и Gradle качаются в облако, ты скачиваешь только готовый APK.
#
# Запуск: вкладка Actions -> "Build Android APK" -> Run workflow.
# Готовый файл: внизу страницы запуска, раздел Artifacts -> kot-defense-apk.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Gradle из p4a требует именно Java 17. На раннере по умолчанию Java 11,
      # и без этого шага сборка падает на "requires Java 17 to run".
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.6.0" "cython<3"

      # Кэшируем ТОЛЬКО тулчейн (SDK/NDK/Gradle), но не сборочные каталоги p4a:
      # при их кэшировании p4a переиспользует старый дистрибутив с уже собранным
      # pygame и молча игнорирует изменения в recipes/pygame.
      - name: Cache Android SDK/NDK and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform/android-sdk
            ~/.buildozer/android/platform/android-ndk-*
            ~/.buildozer/android/platform/python-for-android
            ~/.gradle
          key: toolchain-${{ runner.os }}-v1
          restore-keys: |
            toolchain-${{ runner.os }}-

      - name: Build debug APK
        run: |
          export ANDROID_HOME=""
          export ANDROID_SDK_ROOT=""
          export JAVA_HOME="${JAVA_HOME:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kot-defense-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .buildozer/android/platform/build-*/build.log
          retention-days: 7
          if-no-files-found: ignore
