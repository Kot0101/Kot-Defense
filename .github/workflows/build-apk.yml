name: Build Android APK

# Сборка идёт на серверах GitHub, а не на твоём компьютере:
# Android SDK, NDK и Gradle качаются в облако, ты скачиваешь только готовый APK.
#
# Запуск: вкладка Actions -> "Build Android APK" -> Run workflow.
# Готовый файл: внизу страницы запуска, раздел Artifacts -> kot-defense-apk.

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.6.0" "cython<3"

      - name: Cache buildozer (SDK/NDK/python-for-android)
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build debug APK
        run: |
          export ANDROID_HOME=""
          export ANDROID_SDK_ROOT=""
          export JAVA_HOME="${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kot-defense-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            .buildozer/android/platform/build-*/build.log
          retention-days: 7
          if-no-files-found: ignore
